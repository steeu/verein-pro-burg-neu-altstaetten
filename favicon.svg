<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#241D14"/>

  <!-- Burg als eine Silhouette: Torkel, Wohnturm, Steilgiebel -->
  <g fill="#C9A24B">
    <path d="M15 27v-6l5-4 9 4v6Z"/>
    <rect x="7" y="12" width="14" height="15"/>
    <path d="M4.4 12 14 2 23.6 12Z"/>
  </g>

  <!-- Fensteröffnungen: unregelmässig platziert wie am Bau -->
  <g fill="#241D14">
    <!-- Giebelfenster nahe dem First -->
    <rect x="12.9" y="4.2" width="2.5" height="2.5"/>
    <!-- schmale Reihe unter dem Dach -->
    <rect x="8.6" y="13.5" width="1.9" height="2"/>
    <rect x="11.3" y="13.4" width="1.9" height="2"/>
    <rect x="14" y="13.2" width="1.9" height="2.2"/>
    <!-- mittlere Fenster, ungleich hoch -->
    <rect x="8.9" y="17.3" width="2.7" height="3.3"/>
    <rect x="14.7" y="16.6" width="3" height="3.6"/>
    <!-- untere Fenster, kleiner und versetzt -->
    <rect x="9.4" y="22" width="2.2" height="2.6"/>
    <rect x="14.4" y="22.4" width="1.9" height="2.3"/>
  </g>
</svg>
